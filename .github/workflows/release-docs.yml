name: Release Docs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run production release docs core
        uses: ./.github/actions/release-docs-core
        with:
          release-version: ${{ github.ref_name }}
          require-eligible-tag: "true"
          publish-docs: "true"
