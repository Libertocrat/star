name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run production release core
        uses: ./.github/actions/release-core
        with:
          release-version: ${{ github.ref_name }}
          release-tag-name: ${{ github.ref_name }}
          release-name: Release ${{ github.ref_name }}
          image-name: star
          release-draft: "false"
          generate-release-notes: "true"
          require-eligible-tag: "true"
          verify-release-assets: "true"
