name: Release core
description: Build and publish a STAR release with configurable release identity and validation profile.

inputs:
  github-token:
    description: GitHub token forwarded by the calling workflow for registry and release publication.
    required: true
  release-version:
    description: Strict SemVer version tag used by artifacts and image metadata.
    required: true
  release-tag-name:
    description: Git tag attached to the GitHub Release.
    required: true
  release-name:
    description: Human-readable GitHub Release title.
    required: true
  image-name:
    description: Lowercase GHCR image package name.
    required: true
  release-draft:
    description: Whether to create the GitHub Release as a draft.
    required: true
  generate-release-notes:
    description: Whether GitHub should generate release notes.
    required: true
  require-eligible-tag:
    description: Whether the source must be a strict production release tag on the default branch.
    required: true
  verify-release-assets:
    description: Whether to verify checksums and the Cosign bundle in the runner.
    required: true

runs:
  using: composite
  steps:
    - name: Verify release tag eligibility
      if: inputs.require-eligible-tag == 'true'
      uses: ./.github/actions/verify-release-tag
      with:
        base-ref: ${{ github.event.repository.default_branch }}

    - name: Normalize release metadata
      shell: bash
      env:
        INPUT_IMAGE_NAME: ${{ inputs.image-name }}
        INPUT_RELEASE_VERSION: ${{ inputs.release-version }}
        INPUT_RELEASE_TAG_NAME: ${{ inputs.release-tag-name }}
        INPUT_RELEASE_NAME: ${{ inputs.release-name }}
      run: |
        set -Eeuo pipefail
        echo "IMAGE_NAME=$(echo "${INPUT_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
        echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
        echo "RELEASE_VERSION=${INPUT_RELEASE_VERSION}" >> "$GITHUB_ENV"
        echo "RELEASE_TAG_NAME=${INPUT_RELEASE_TAG_NAME}" >> "$GITHUB_ENV"
        echo "RELEASE_NAME=${INPUT_RELEASE_NAME}" >> "$GITHUB_ENV"
        echo "APP_VERSION=${INPUT_RELEASE_VERSION#v}" >> "$GITHUB_ENV"

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Extract image metadata (semver + sha tags)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{raw}},value=${{ inputs.release-version }}
          type=semver,pattern={{version}},value=${{ inputs.release-version }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release-version }}
          type=semver,pattern={{major}},value=${{ inputs.release-version }}
          type=sha,format=short
          type=raw,value=latest

    - name: Build image locally (no push yet)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        pull: true
        build-args: |
          STAR_APP_VERSION=${{ env.APP_VERSION }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        load: true
        cache-from: type=gha,scope=star
        cache-to: type=gha,mode=max,scope=star

    - name: Cache Trivy DB
      uses: actions/cache@v4
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ runner.os }}

    - name: Install Trivy
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
          gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
          sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install -y trivy

    - name: Scan image before publish (block on HIGH/CRITICAL)
      shell: bash
      env:
        IMAGE_REF: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
      run: |
        set -Eeuo pipefail
        trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE_REF"

    - name: Push semver + sha + latest tags
      shell: bash
      run: |
        set -Eeuo pipefail
        canonical_tag="ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:${RELEASE_VERSION}"
        echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | while read -r tag; do
          [ -n "$tag" ] || continue
          docker push "$tag"
        done

        canonical_digest="$(docker buildx imagetools inspect "$canonical_tag" --format '{{.Manifest.Digest}}')"
        case "$canonical_digest" in
          sha256:[0-9a-f][0-9a-f]*) ;;
          *)
            echo "Unable to resolve a SHA-256 digest for ${canonical_tag}"
            exit 1
            ;;
        esac

        while read -r tag; do
          [ -n "$tag" ] || continue
          tag_digest="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
          if [[ "$tag_digest" != "$canonical_digest" ]]; then
            echo "Tag ${tag} resolved to ${tag_digest}, expected ${canonical_digest}"
            exit 1
          fi
        done < <(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n')

        echo "IMAGE_DIGEST=${canonical_digest}" >> "$GITHUB_ENV"

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3

    - name: Sign published image digest with GitHub OIDC
      shell: bash
      env:
        IMAGE_REPOSITORY: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
      run: |
        set -Eeuo pipefail
        cosign sign --yes "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

    - name: Install release asset tooling
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y zip

    - name: Setup Python for OpenAPI export
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ hashFiles('requirements/**/*.txt') }}
        restore-keys: |
          pip-${{ runner.os }}-

    - name: Install dependencies for OpenAPI export
      shell: bash
      run: |
        set -Eeuo pipefail
        python -m pip install --upgrade pip
        python -m pip install -r requirements/runtime.txt
        python -m pip install -r requirements/testing.txt
        python -m pip install -e .

    - name: Export OpenAPI schema
      shell: bash
      env:
        STAR_DOCS_ROOT_DIR: ${{ runner.temp }}/star-docs
      run: |
        set -Eeuo pipefail
        export RELEASE_VERSION="${RELEASE_VERSION}"
        python scripts/export_openapi.py

    - name: Prepare OpenAPI release assets
      shell: bash
      run: |
        set -Eeuo pipefail
        rm -rf dist
        mkdir -p dist
        cp docs/api-docs/output/openapi.json dist/openapi.json
        cp dist/openapi.json "dist/openapi-${RELEASE_VERSION}.json"

    - name: Generate image SBOM
      shell: bash
      env:
        IMAGE_REF: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
      run: |
        set -Eeuo pipefail
        trivy image --format spdx-json --output "dist/star-image-${RELEASE_VERSION}.spdx.json" "$IMAGE_REF"

    - name: Generate image provenance attestation
      uses: actions/attest@v4
      with:
        subject-name: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ env.IMAGE_DIGEST }}
        push-to-registry: true

    - name: Generate image SBOM attestation
      uses: actions/attest@v4
      with:
        subject-name: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ env.IMAGE_DIGEST }}
        sbom-path: dist/star-image-${{ env.RELEASE_VERSION }}.spdx.json
        push-to-registry: true

    - name: Build deploy bundle assets
      shell: bash
      run: |
        set -Eeuo pipefail
        bundle_name="star-deploy"
        versioned_bundle_name="${bundle_name}-${RELEASE_VERSION}"
        mkdir -p "dist/${bundle_name}"
        cp -a deploy/. "dist/${bundle_name}/"
        printf '%s\n' "${RELEASE_VERSION}" > "dist/${bundle_name}/star-runtime/.star-release-version"

        if [[ -f "dist/${bundle_name}/star-runtime/.env" ]]; then
          echo "Refusing to package star-runtime/.env"
          exit 1
        fi
        if [[ -f "dist/${bundle_name}/star-runtime/secrets/star_api_token.txt" ]]; then
          echo "Refusing to package star-runtime/secrets/star_api_token.txt"
          exit 1
        fi

        chmod +x "dist/${bundle_name}/star"
        if [[ -d "dist/${bundle_name}/star-runtime/scripts" ]]; then
          find "dist/${bundle_name}/star-runtime/scripts" -type f -name "*.sh" -exec chmod +x {} \;
        fi

        tar -C dist -czf "dist/${versioned_bundle_name}.tar.gz" "${bundle_name}"
        cp "dist/${versioned_bundle_name}.tar.gz" "dist/${bundle_name}.tar.gz"
        (
          cd dist
          zip -qr "${versioned_bundle_name}.zip" "${bundle_name}"
          cp "${versioned_bundle_name}.zip" "${bundle_name}.zip"
        )

    - name: Generate release checksums
      shell: bash
      run: |
        set -Eeuo pipefail
        (
          cd dist
          sha256sum \
            openapi.json \
            "openapi-${RELEASE_VERSION}.json" \
            "star-image-${RELEASE_VERSION}.spdx.json" \
            "star-deploy-${RELEASE_VERSION}.tar.gz" \
            "star-deploy-${RELEASE_VERSION}.zip" \
            star-deploy.tar.gz \
            star-deploy.zip \
            > SHA256SUMS
        )

    - name: Sign release checksums with GitHub OIDC
      shell: bash
      run: |
        set -Eeuo pipefail
        cosign sign-blob --yes --bundle "dist/SHA256SUMS.sigstore.json" "dist/SHA256SUMS"

    - name: Validate release assets
      if: inputs.verify-release-assets == 'true'
      shell: bash
      run: |
        set -Eeuo pipefail
        test -f "dist/star-deploy-${RELEASE_VERSION}.tar.gz"
        test -f "dist/star-deploy-${RELEASE_VERSION}.zip"
        test -f dist/star-deploy.tar.gz
        test -f dist/star-deploy.zip
        test -f "dist/star-image-${RELEASE_VERSION}.spdx.json"
        test -f dist/SHA256SUMS
        test -f dist/SHA256SUMS.sigstore.json

        tar_listing="$(mktemp)"
        tar -tzf "dist/star-deploy-${RELEASE_VERSION}.tar.gz" > "$tar_listing"
        grep -qx 'star-deploy/star' "$tar_listing"
        grep -qx 'star-deploy/README.md' "$tar_listing"
        grep -qx 'star-deploy/star-runtime/.star-release-version' "$tar_listing"
        grep -q '^star-deploy/star-runtime/' "$tar_listing"

        (
          cd dist
          sha256sum -c SHA256SUMS
          expected_assets=(
            openapi.json
            "openapi-${RELEASE_VERSION}.json"
            "star-image-${RELEASE_VERSION}.spdx.json"
            "star-deploy-${RELEASE_VERSION}.tar.gz"
            "star-deploy-${RELEASE_VERSION}.zip"
            star-deploy.tar.gz
            star-deploy.zip
          )
          actual_assets="$(awk '{print $2}' SHA256SUMS)"
          if [[ "$(printf '%s\n' "$actual_assets" | sort -u | wc -l)" -ne "${#expected_assets[@]}" ]]; then
            echo "SHA256SUMS must list every release content asset exactly once"
            exit 1
          fi
          for asset in "${expected_assets[@]}"; do
            if [[ "$(printf '%s\n' "$actual_assets" | grep -Fxc "$asset")" -ne 1 ]]; then
              echo "SHA256SUMS must list ${asset} exactly once"
              exit 1
            fi
          done
        )

        cosign verify-blob \
          --bundle "dist/SHA256SUMS.sigstore.json" \
          --certificate-identity-regexp "^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/tags/${RELEASE_VERSION}$" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          "dist/SHA256SUMS"

    - name: Validate smoke release asset structure
      if: inputs.verify-release-assets != 'true'
      shell: bash
      run: |
        set -Eeuo pipefail
        test -f "dist/star-deploy-${RELEASE_VERSION}.tar.gz"
        test -f "dist/star-deploy-${RELEASE_VERSION}.zip"
        test -f dist/star-deploy.tar.gz
        test -f dist/star-deploy.zip
        test -f "dist/star-image-${RELEASE_VERSION}.spdx.json"
        test -f dist/SHA256SUMS
        test -f dist/SHA256SUMS.sigstore.json

        tar_listing="$(mktemp)"
        tar -tzf "dist/star-deploy-${RELEASE_VERSION}.tar.gz" > "$tar_listing"
        grep -qx 'star-deploy/star' "$tar_listing"
        grep -qx 'star-deploy/README.md' "$tar_listing"
        grep -qx 'star-deploy/star-runtime/.star-release-version' "$tar_listing"
        grep -q '^star-deploy/star-runtime/' "$tar_listing"

    - name: Create GitHub Release and upload assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release-tag-name }}
        target_commitish: ${{ github.sha }}
        name: ${{ inputs.release-name }}
        draft: ${{ inputs.release-draft }}
        generate_release_notes: ${{ inputs.generate-release-notes }}
        fail_on_unmatched_files: true
        files: |
          dist/openapi.json
          dist/openapi-${{ env.RELEASE_VERSION }}.json
          dist/star-image-${{ env.RELEASE_VERSION }}.spdx.json
          dist/star-deploy-${{ env.RELEASE_VERSION }}.tar.gz
          dist/star-deploy-${{ env.RELEASE_VERSION }}.zip
          dist/star-deploy.tar.gz
          dist/star-deploy.zip
          dist/SHA256SUMS
          dist/SHA256SUMS.sigstore.json
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
